[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-vartaloop"
version = "0.1.0"
description = "Vartaloop TTS services for Pipecat: Hinglish and Indian-language text-to-speech, streamed from the first frame"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [{ name = "Vartaloop" }]
keywords = ["pipecat", "tts", "vartaloop", "hinglish", "voice", "agents"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["pipecat-ai>=1.15.0", "aiohttp>=3.9", "websockets>=13.1", "loguru>=0.7"]

[project.urls]
Homepage = "https://vartaloop.ai"
Documentation = "https://docs.vartaloop.ai"
Source = "https://github.com/vartalaap-si/pipecat-vartaloop"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_vartaloop"]

[tool.ruff]
line-length = 100
